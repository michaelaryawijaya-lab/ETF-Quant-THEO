[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-futures-rv"
version = "0.1.0"
description = "Reproducible research framework for SPY versus E-mini S&P 500 futures relative value."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "streamlit>=1.39",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["etf_futures_rv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
